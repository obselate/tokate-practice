name: Refs probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.sha }}
    steps:
      - name: Probe hidden refs
        shell: bash
        run: |
          set -euo pipefail
          ref="tokate/probe-$GITHUB_RUN_ID"
          api() {
            local label="$1" expected="$2"
            shift 2
            local rc=0
            gh api --include "$@" > response.txt 2> error.txt || rc=$?
            cat response.txt
            cat error.txt
            status=$(awk '/^HTTP\// {print $2; exit}' response.txt)
            echo "RESULT $label HTTP $status gh_exit $rc"
            test "$status" = "$expected"
          }
          cleanup() {
            gh api --include --method DELETE "repos/$REPO/git/refs/$ref" || true
          }
          trap cleanup EXIT
          api create 201 --method POST "repos/$REPO/git/refs" -f ref="refs/$ref" -f sha="$BASE"
          api read 200 "repos/$REPO/git/ref/$ref"
          test "$(sed '1,/^\r\{0,1\}$/d' response.txt | jq -r .object.sha)" = "$BASE"
          api list 200 "repos/$REPO/git/matching-refs/tokate/"
          sed '1,/^\r\{0,1\}$/d' response.txt | jq -e --arg ref "refs/$ref" 'any(.[]; .ref == $ref)'
          api branches_before 200 "repos/$REPO/branches?per_page=100"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > branches.txt
          if grep -Fx "$ref" branches.txt; then exit 1; fi
          echo "RESULT branches_before hidden ref absent"
          api parent_commit 200 "repos/$REPO/git/commits/$BASE"
          tree=$(sed '1,/^\r\{0,1\}$/d' response.txt | jq -r .tree.sha)
          jq -n --arg tree "$tree" --arg base "$BASE" --arg message "Hidden ref probe $GITHUB_RUN_ID" '{tree:$tree,parents:[$base],message:$message}' > commit.json
          api commit 201 --method POST "repos/$REPO/git/commits" --input commit.json
          next=$(sed '1,/^\r\{0,1\}$/d' response.txt | jq -r .sha)
          api fast_forward 200 --method PATCH "repos/$REPO/git/refs/$ref" -f sha="$next" -F force=false
          api non_fast_forward 422 --method PATCH "repos/$REPO/git/refs/$ref" -f sha="$BASE" -F force=false
          api read_after_rejection 200 "repos/$REPO/git/ref/$ref"
          test "$(sed '1,/^\r\{0,1\}$/d' response.txt | jq -r .object.sha)" = "$next"
          api branches_after 200 "repos/$REPO/branches?per_page=100"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > branches.txt
          if grep -Fx "$ref" branches.txt; then exit 1; fi
          echo "RESULT branches_after hidden ref absent"
          api delete 204 --method DELETE "repos/$REPO/git/refs/$ref"
          trap - EXIT
          api read_after_delete 404 "repos/$REPO/git/ref/$ref"
